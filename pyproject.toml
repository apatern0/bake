[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bake-eda"
version = "1.0.0"
description = "EDA flow manager for ASIC designs: manifest-driven simulation, synthesis and place-and-route"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andrea Paterno'" }]
keywords = ["asic", "eda", "rtl", "verification", "build-system", "tmr", "sky130"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "argcomplete",
    "coloredlogs",
    "pydantic>=2",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pylint", "pylint-pydantic", "ruff", "mypy", "build", "twine"]
docs = ["zensical"]

[project.urls]
Homepage = "https://github.com/apatern0/bake"
Documentation = "https://apatern0.github.io/bake/"
Source = "https://github.com/apatern0/bake"
Issues = "https://github.com/apatern0/bake/issues"

[project.scripts]
bake = "bake.cli:main"

[tool.setuptools.packages.find]
# The built-in steps live inside the package so that a non-editable install can
# find them (bake/cli.py resolves them relative to __file__). They are data, not
# Python modules (`manifest` files have no extension, flows are .tpl scripts),
# but their directories have to be listed as (namespace) packages for
# setuptools to ship the data below without warning.
include = ["bake", "bake.*"]
namespaces = true

[tool.setuptools.package-data]
bake = ["builtin/**"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pyflakes, pycodestyle and bugbear: mistakes, not style.
select = ["E", "F", "W", "B"]

[tool.mypy]
ignore_missing_imports = true

[tool.pylint.main]
# The manifest specs are pydantic models; without the plugin pylint reports
# their Field() defaults as FieldInfo instances.
load-plugins = ["pylint_pydantic"]
