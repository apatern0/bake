# Documentation site configuration for Zensical (https://zensical.org).
# Build with `zensical build --strict`, preview with `zensical serve`.

[project]
site_name = "bake"
site_description = "EDA flow manager for ASIC designs: manifest-driven simulation, synthesis and place-and-route"
site_url = "https://apatern0.github.io/bake/"
copyright = "Copyright 2025 CERN, 2026 Andrea Paterno&#39; &mdash; Apache-2.0. Derived from tmake."

repo_url = "https://github.com/apatern0/bake"
repo_name = "apatern0/bake"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Introduction" = "introduction.md" },
  { "Quick Start" = "quickstart.md" },
  { "Installation" = "installation.md" },
  { "Command Line" = "cli.md" },
  { "User Guide" = [
    { "Glossary" = "glossary.md" },
    { "Design Modeling" = "manifest_design_model.md" },
    { "Verification Modeling" = "manifest_verif_model.md" },
    { "Configuration" = "configuration.md" },
  ] },
  { "Extending" = [
    { "Custom Steps" = "custom_steps.md" },
    { "Custom Flows" = "custom_flows.md" },
  ] },
  { "Releases" = "releases.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/apatern0/bake"

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
