name: Release

# release-please keeps a release pull request open on main, with the next
# version (from the Conventional Commits since the last release) and its
# changelog in docs/releases.md. Merging it tags vX.Y.Z and creates the GitHub
# release. Publishing to PyPI is off until the repository variable
# PYPI_PUBLISH is "true"; a release made before that is published by running
# this workflow by hand with its tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to PyPI (e.g. v2.0.0)
        required: true

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  pypi:
    # A tag pushed with the workflow's token triggers no other workflow, so
    # publishing lives here rather than in a workflow on tag pushes.
    needs: release-please
    if: >-
      always() && vars.PYPI_PUBLISH == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing, no API token needed
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
