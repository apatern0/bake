name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: python -m pytest --junitxml=pytest.xml
      - name: Lint (errors only)
        run: python -m pylint -E bake/

  install-wheel:
    # The built-in steps must ship inside the wheel: install non-editable and
    # check that a bare `bake` finds them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - run: pip install dist/*.whl
      - run: |
          mkdir /tmp/p && cd /tmp/p
          printf 'from bake import block\nblock(name="x", top="x", rtl_files=[])\n' > manifest
          bake | tee out.txt
          grep -q -- '- vrf' out.txt && grep -q -- '- impl' out.txt && grep -q -- '- tmr' out.txt

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force
