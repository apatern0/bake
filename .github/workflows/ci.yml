name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: python -m pytest --junitxml=pytest.xml
      - name: Lint (errors only)
        run: python -m pylint -E bake/
      - name: Ruff
        run: ruff check bake/ test/
      - name: Type check
        run: python -m mypy bake/

  package:
    # The built-in steps must ship inside the wheel: build both distributions,
    # check them, install the wheel non-editable and check that a bare `bake`
    # finds the steps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build
      - run: twine check dist/*
      - name: The sdist carries no example outputs
        run: |
          ! tar tzf dist/*.tar.gz | grep -E '/example/[^/]+/(flow|work)/'
      - run: pip install dist/*.whl
      - name: Run bake from a fresh directory outside the checkout
        run: |
          cd "$(mktemp -d)"
          printf 'from bake import block\nblock(name="x", top="x", rtl_files=[])\n' > manifest
          bake 2>&1 | tee out.txt
          grep -q -- '- vrf' out.txt && grep -q -- '- impl' out.txt && grep -q -- '- tmr' out.txt

  sky130:
    # The impl step's reference flow end to end on an open PDK: Yosys,
    # OpenROAD and Icarus from conda (litex-hub; fmt 8 is what the OpenROAD
    # build links against), the PDK fetched with ciel and cached. bake itself
    # depends on none of this; they are test fixtures.
    runs-on: ubuntu-latest
    env:
      PDK_ROOT: ${{ github.workspace }}/.pdk
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          channels: litex-hub,conda-forge
          activate-environment: eda
      - name: Install Yosys, OpenROAD and Icarus Verilog
        run: conda install -y openroad yosys iverilog "fmt=8"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PDK_ROOT }}
          key: sky130-${{ hashFiles('test/pdk/fetch_sky130.sh') }}
      - run: pip install -e ".[test]"
      - run: test/pdk/fetch_sky130.sh
      - run: yosys -V && openroad -version && iverilog -V | head -1
      - run: python -m pytest -k sky130 -rs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: zensical build --strict --clean
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy-docs:
    # Publishes the site built above through GitHub Pages. The repository's
    # Pages source must be set to "GitHub Actions" (Settings > Pages).
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
