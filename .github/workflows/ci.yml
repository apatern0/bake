name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: python -m pytest --junitxml=pytest.xml
      - name: Lint (errors only)
        run: python -m pylint -E bake/

  install-wheel:
    # The built-in steps must ship inside the wheel: install non-editable and
    # check that a bare `bake` finds them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - run: pip install dist/*.whl
      - name: Run bake from a fresh directory outside the checkout
        run: |
          cd "$(mktemp -d)"
          printf 'from bake import block\nblock(name="x", top="x", rtl_files=[])\n' > manifest
          bake 2>&1 | tee out.txt
          grep -q -- '- vrf' out.txt && grep -q -- '- impl' out.txt && grep -q -- '- tmr' out.txt

  sky130:
    # The impl step's reference flow on an open PDK. The PDK is a test
    # fixture, fetched with ciel and cached; bake itself does not depend on it.
    runs-on: ubuntu-latest
    env:
      PDK_ROOT: ${{ github.workspace }}/.pdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ${{ env.PDK_ROOT }}
          key: sky130-${{ hashFiles('test/pdk/fetch_sky130.sh') }}
      - run: pip install -e ".[test]"
      - run: test/pdk/fetch_sky130.sh
      - run: python -m pytest -k sky130 -rs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdocs gh-deploy --force
